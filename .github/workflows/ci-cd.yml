name: JogaMuito CI

on:
  push:
    paths:
      - '**/*'
  pull_request:
    paths:
      - '**/*'
  workflow_dispatch:

defaults:
  run:
    shell: bash
    working-directory: .

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências do app
        run: npm ci

      - name: Executar testes unitários com Jest
        run: npm test -- --runInBand
